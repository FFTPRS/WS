program: 
  - day: "1日目: 2026年09月15日(火)"
    time_schedule: 
    - time: "13:00 - 13:25"
      title: "受付"
      speaker: ""
      description: ""
    - time: "13:25 - 13:30"
      title: "開会挨拶"
      speaker: ""
      description: "以下、発表・質疑で30分/人、転換時間は発表時間に含めます。*は発表者です。"
    - time: "13:30 - 14:00"
      title: "講演1: PQC における SHA-3/SHAKE の選択根拠と代替候補に関する調査報告"
      speaker: "*小寺 雄太(岡山大学)"
      description: "This paper surveys why SHAKE is widely used for deterministic expansion and why the SHA-3 family repeatedly appears as an internal component of NIST post-quantum cryptography (PQC).We distinguish entropy sources and deterministic random bit generators (DRBGs) from extendable-output functions (XOFs) and pseudorandom functions (PRFs) used inside ML-KEM, ML-DSA, and SLH-DSA. SHAKE combines native variable-length output, NIST approval, a random-oracle rationale, and a reusable implementation. Possible migration paths include SHA-2 with keyed-hash message authentication codes (HMACs) and mask generation functions (MGFs), AES-based expansion, Ascon-XOF128, and independently designed XOFs. Their suitability depends on the failure mode, required security category, proof assumptions, and platform rather than speed alone.<br/>
        Keywords— post-quantum cryptography, SHA-3, SHAKE, sponge construction, seed expansion"
    - time: "14:00 - 14:30"
      title: "講演2: ブロックチェーン型大学図書館コンソーシアムにおける利用資格認証の要件と構成"
      speaker: "*関川 謙人(北九州市立大学), 荒木 俊輔(九州工業大学), 上原 聡(北九州市立大学)"
      description: "This study examines how user authentication should be designed for a blockchain-based academic library consortium. We define requirements for privacy, eligibility verification, availability, and the integrity of usage and royalty records. We then describe an architecture that separates personal information and individual reading histories from information shared on a consortium blockchain. Single Sign-On (SSO), Verifiable Credentials (VCs), and their possible combination are considered as authentication options. Neither SSO nor VCs inherently requires blockchain; the shared ledger instead provides trust information, access policies, and verifiable records across institutions. Further study is required to determine the appropriate division of roles and address credential sharing and revocation.<br/>
        Keywords— Blockchain, Digital Library, User Authentication, Single Sign-On, Verifiable Credentials
    - time: "14:30 - 15:00"
      title: "休憩"
      speaker: ""
      description: ""
    - time: "15:00 - 15:30"
      title: "講演3: キルヒホッフの行列木定理による迷路の種類数探索"
      speaker: "発表者:  *宮崎 武(九州情報大学), 荒木 俊輔(九州工業大学), 上原 聡(北九州市立大学)"
      description: "In this paper, we use Kirchhoff’s Matrix Tree Theorem from graph theory to theoretically analyze the number of distinct maze types considering both connected and unconnected cases and demonstrate that our calculations are correct by comparing the results with those obtained through exhaustive searches on a smaller scale.<br/>
        Keywords— Kirchhoff’s Matrix Tree Theorem, Deterministic Maze Method, Pseudorandom Number Generator"
    - time: "15:30 - 16:00"
      title: "講演4: 数論変換行列を用いた有限体上の巡回アダマール型行列の生成法"
      speaker: "兒玉 伊織(東京工業高等専門学校), *小嶋 徹也(東京工業高等専門学校)"
      description: "Hadamard matrix is defined as a square matrix where any components are −1 or +1, and where any pairs of rows are mutually orthogonal. Hadamard-type matrix over finite fields is a similar one, but has multi-valued components on finite fields. To be more specific, we consider an <i>n</i>×<i>n</i> matrix <i>H</i> that has their elements on the given finite fields GF(<i>p</i>), and satisfies <i>HH<sup>T</sup></i> = <i>nI<sub>n</sub></i>, where <i>I<sup>n</sup></i> is an identity matrix of order <i>n</i>. In the authors’ previous studies, some properties of Hadamard-type matrices on finite fields have been proven. For example, it has been shown that the order of a Hadamard-type matrix of odd order on GF(<i>p</i>) is limited to a quadratic residue of a given prime <i>p</i>. In addition, the authors count all possible Hadamard-type matrices on finite field when the order <i>n</i> of a matrix is small. The authors have also propose the method to generate circulant matrices which have two or three different elements on GF(<i>p</i>). In this paper, we propose a new method to generate circulant Hadamard-type matrices that is different from the previous cases and that have four or more elements on GF(<i>p</i>) based on number theoretic transform matrices.<br/>
        Keywords— Hadamard-type matrix, finite field, circulant matrix, number theoretic transform matrix, eigenvalue"
    - time: "16:00 - 16:30"
      title: "講演5: QCGおよび整数上のテント写像に対する攪拌処理の適用とNIST SP800-22による評価"
      speaker: "*桑原 大雅(北九州市立大学), 林 夏生(北九州市立大学), 上原 聡(北九州市立大学)"
      description: "TBA"
    - time: "19:00 - 22:00"
      title: "懇親会"
      speaker: "会場: もつ鍋とごま鯖が自慢の居酒屋 個室 しろ屋 博多駅筑紫口店"
      description: "🏮福岡県福岡市博多区博多駅東2-1-24 ギャラリー博多6F<br />
                    ☎️ 092-411-0558<br />
